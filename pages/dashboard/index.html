<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRPG 管理</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="notice" aria-labelledby="notice-title">
        <h1 id="notice-title">LLM TRPG 管理面板</h1>
        <p>
          推荐通过本 WebGUI 管理插件设置和剧本。直接修改配置文件容易遗漏类型转换、
          默认值和全局剧本同步。
        </p>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section class="layout" aria-label="TRPG 插件管理">
        <aside class="script-list" aria-labelledby="scripts-heading">
          <div class="section-header">
            <div>
              <h2 id="scripts-heading">剧本</h2>
              <p id="script-count">0 个剧本</p>
            </div>
            <button id="new-script" type="button">新建</button>
          </div>
          <label class="field compact" for="script-search">
            <span>搜索剧本</span>
            <input id="script-search" type="search" autocomplete="off" />
          </label>
          <div id="scripts" class="scripts" role="list"></div>
        </aside>

        <section class="workspace" aria-label="剧本编辑与设置">
          <nav class="tabs" aria-label="管理区域">
            <button class="tab active" type="button" data-tab="script">剧本编辑</button>
            <button class="tab" type="button" data-tab="knowledge">战役知识库</button>
            <button class="tab" type="button" data-tab="settings">插件设置</button>
            <button class="tab" type="button" data-tab="import">导入导出</button>
          </nav>

          <section id="tab-script" class="tab-panel active" aria-labelledby="script-form-heading">
            <form id="script-form" class="form">
              <div class="section-header">
                <div>
                  <h2 id="script-form-heading">剧本编辑</h2>
                  <p>保存后所有会话都可用 `/trpg_start 剧本名` 启动。</p>
                </div>
                <div class="actions">
                  <button id="delete-script" class="danger" type="button">删除</button>
                  <button type="submit">保存剧本</button>
                </div>
              </div>

              <div class="grid three">
                <label class="field" for="script-title">
                  <span>标题</span>
                  <input id="script-title" name="title" required />
                </label>
                <label class="field" for="script-language">
                  <span>语言</span>
                  <select id="script-language" name="language">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                  </select>
                </label>
                <label class="field" for="script-ruleset-id">
                  <span>规则系统</span>
                  <select id="script-ruleset-id" name="ruleset_id">
                    <option value="d20_lite">d20 Lite</option>
                    <option value="coc7_lite">CoC 7e Lite</option>
                  </select>
                </label>
              </div>

              <div class="grid two">
                <label class="field" for="script-play-mode">
                  <span>玩法模式</span>
                  <select id="script-play-mode" name="play_mode">
                    <option value="simple">简易模式</option>
                    <option value="advanced">进阶模式</option>
                    <option value="custom">自定义模式</option>
                  </select>
                </label>
                <label class="field" for="script-turn-order-mode">
                  <span>行动顺序模式</span>
                  <select id="script-turn-order-mode" name="turn_order_mode">
                    <option value="llm_gm">LLM 主持人强控制</option>
                    <option value="soft">玩家软顺序</option>
                  </select>
                </label>
              </div>

              <fieldset id="script-feature-flags" class="feature-flags">
                <legend>自定义机制开关</legend>
                <label class="checkbox-row">
                  <input type="checkbox" data-feature-flag="command_agent_enabled" />
                  <span>命令转换 Agent</span>
                </label>
                <label class="checkbox-row">
                  <input type="checkbox" data-feature-flag="turn_order_enabled" />
                  <span>行动顺序</span>
                </label>
                <label class="checkbox-row">
                  <input type="checkbox" data-feature-flag="structured_patch_enabled" />
                  <span>结构化 JSON</span>
                </label>
                <label class="checkbox-row">
                  <input type="checkbox" data-feature-flag="dice_requests_enabled" />
                  <span>骰子检定</span>
                </label>
                <label class="checkbox-row">
                  <input type="checkbox" data-feature-flag="state_patch_enabled" />
                  <span>状态变更</span>
                </label>
                <label class="checkbox-row">
                  <input type="checkbox" data-feature-flag="knowledge_enabled" />
                  <span>战役知识库</span>
                </label>
                <label class="checkbox-row">
                  <input type="checkbox" data-feature-flag="second_pass_resolution_enabled" />
                  <span>二次结算叙事</span>
                </label>
              </fieldset>

              <label class="field" for="script-theme">
                <span>主题</span>
                <input id="script-theme" name="theme" />
              </label>

              <label class="field" for="script-summary">
                <span>简介</span>
                <textarea id="script-summary" name="summary" rows="3"></textarea>
              </label>

              <label class="field" for="script-background">
                <span>背景</span>
                <textarea id="script-background" name="background" rows="5"></textarea>
              </label>

              <label class="field" for="script-opening">
                <span>开场场景</span>
                <textarea id="script-opening" name="opening_scene" rows="4"></textarea>
              </label>

              <div class="grid two">
                <label class="field" for="script-hooks">
                  <span>线索</span>
                  <textarea id="script-hooks" name="hooks" rows="5"></textarea>
                </label>
                <label class="field" for="script-tags">
                  <span>标签</span>
                  <input id="script-tags" name="tags" />
                </label>
              </div>

              <label class="field" for="script-notes">
                <span>GM 备注</span>
                <textarea id="script-notes" name="gm_notes" rows="5"></textarea>
              </label>

              <label class="field" for="script-rule-nodes">
                <span>检定节点 JSON</span>
                <textarea id="script-rule-nodes" name="rule_nodes" rows="8"></textarea>
              </label>
            </form>
          </section>

          <section id="tab-knowledge" class="tab-panel" aria-labelledby="knowledge-heading">
            <div class="form">
              <div class="section-header">
                <div>
                  <h2 id="knowledge-heading">战役知识库</h2>
                  <p>按可见性、类型和状态筛选当前载入的战役记忆。</p>
                </div>
              </div>
              <div class="grid three">
                <label class="field" for="knowledge-visibility">
                  <span>可见性</span>
                  <select id="knowledge-visibility">
                    <option value="">全部</option>
                    <option value="public">public</option>
                    <option value="private">private</option>
                    <option value="gm_only">gm_only</option>
                  </select>
                </label>
                <label class="field" for="knowledge-type">
                  <span>类型</span>
                  <select id="knowledge-type">
                    <option value="">全部</option>
                    <option value="timeline">时间线</option>
                    <option value="entity">实体</option>
                    <option value="fact">事实</option>
                    <option value="clue">线索</option>
                    <option value="thread">剧情线</option>
                    <option value="relationship">关系</option>
                  </select>
                </label>
                <label class="field" for="knowledge-status">
                  <span>状态</span>
                  <select id="knowledge-status">
                    <option value="">全部</option>
                    <option value="active">active</option>
                    <option value="resolved">resolved</option>
                    <option value="obsolete">obsolete</option>
                  </select>
                </label>
              </div>
              <div id="knowledge-list" class="knowledge-list" role="list"></div>
            </div>
          </section>

          <section id="tab-settings" class="tab-panel" aria-labelledby="settings-heading">
            <form id="settings-form" class="form">
              <div class="section-header">
                <div>
                  <h2 id="settings-heading">插件设置</h2>
                  <p>这里保存的是 AstrBot 插件配置，和 `_conf_schema.json` 保持一致。</p>
                </div>
                <button type="submit">保存设置</button>
              </div>
              <div id="settings-fields" class="settings-fields"></div>
            </form>
          </section>

          <section id="tab-import" class="tab-panel" aria-labelledby="import-heading">
            <div class="form">
              <div class="section-header">
                <div>
                  <h2 id="import-heading">导入导出</h2>
                  <p>JSON 可完整往返；Markdown 支持标题、简介、背景、开场场景、线索、GM 备注。</p>
                </div>
                <button id="export-scripts" type="button">导出 JSON</button>
              </div>
              <label class="field" for="import-filename">
                <span>文件名</span>
                <input id="import-filename" value="scenario.md" />
              </label>
              <label class="field" for="import-content">
                <span>导入内容</span>
                <textarea id="import-content" rows="14"></textarea>
              </label>
              <div class="actions">
                <button id="import-scripts" type="button">导入剧本</button>
              </div>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
